<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 40px 16px;
      color: #111;
    }

    .container { max-width: 560px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }

    .logout-btn {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.85rem;
      color: #6b7280;
      cursor: pointer;
      transition: background .15s;
    }
    .logout-btn:hover { background: #f3f4f6; }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-label {
      font-weight: 600;
      font-size: 0.95rem;
      flex: 1 1 140px;
    }

    .badges { display: flex; gap: 6px; align-items: center; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .badge-on  { background: #d1fae5; color: #065f46; }
    .badge-off { background: #fee2e2; color: #991b1b; }
    .badge-neutral { background: #e5e7eb; color: #4b5563; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn:hover { background: #e5e7eb; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .btn-danger { background: #dc2626; color: #fff; border-color: #dc2626; }
    .btn-danger:hover { background: #b91c1c; border-color: #b91c1c; }

    .note { font-size: 0.8rem; color: #9ca3af; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #111;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #d1d5db; border-top-color: #6b7280; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status-area { display: contents; }
    .loading-placeholder { color: #9ca3af; font-size: 0.9rem; padding: 12px 0; }

    .section-title { font-size: 0.85rem; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; margin: 24px 0 10px; }

    .card-col { flex-direction: column; align-items: stretch; gap: 10px; }

    .card-row { display: flex; justify-content: space-between; align-items: center; }

    textarea.prompt-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-family: "Menlo", "Consolas", monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      resize: vertical;
      color: #111;
      background: #fafafa;
      transition: border-color .15s;
    }
    textarea.prompt-input:focus { outline: none; border-color: #2563eb; background: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SocialMediaBot Admin</h1>
      <button class="logout-btn" onclick="logout()">Выйти</button>
    </header>

    <div id="status-area">
      <p class="loading-placeholder"><span class="spinner"></span>Загрузка...</p>
    </div>

    <p class="section-title">Системные промпты</p>

    <div class="card card-col">
      <div class="card-row">
        <span class="card-label">Орфография</span>
        <span id="spellcheck-file" class="note"></span>
      </div>
      <textarea id="spellcheck-prompt" class="prompt-input" rows="5" placeholder="Загрузка..."></textarea>
    </div>

    <div class="card card-col">
      <div class="card-row">
        <span class="card-label">Варианты твитов</span>
        <span id="variants-file" class="note"></span>
      </div>
      <textarea id="variants-prompt" class="prompt-input" rows="8" placeholder="Загрузка..."></textarea>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:8px; margin-bottom:24px;">
      <button class="btn" onclick="loadPrompts()">Сбросить изменения</button>
      <button class="btn btn-primary" id="save-prompts-btn" onclick="savePrompts()">Сохранить в S3</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentStatus = null;

    async function loadStatus() {
      try {
        const res = await fetch('/admin/api/status');
        if (res.status === 401) { location.href = '/admin/login'; return; }
        if (!res.ok) throw new Error('Ошибка сервера');
        currentStatus = await res.json();
        render(currentStatus);
      } catch (e) {
        document.getElementById('status-area').innerHTML =
          `<p style="color:#dc2626">Ошибка загрузки: ${e.message}</p>`;
      }
    }

    function render(s) {
      const area = document.getElementById('status-area');

      const botRuntimeBadge = s.isBotRunning
        ? `<span class="badge badge-on">РАБОТАЕТ</span>`
        : `<span class="badge badge-off">ОСТАНОВЛЕН</span>`;

      const botToggleBtn = `<button class="btn ${s.isBotRunning ? '' : 'btn-primary'}" onclick="action('bot/toggle')">${s.isBotRunning ? 'Остановить' : 'Запустить'}</button>`;

      area.innerHTML = `
        <div class="card">
          <span class="card-label">Dry Run</span>
          <div class="badges">
            <span class="badge ${s.isDryRun ? 'badge-on' : 'badge-off'}">${s.isDryRun ? 'ВКЛЮЧЁН' : 'ВЫКЛЮЧЕН'}</span>
          </div>
          <div class="actions">
            <button class="btn ${s.isDryRun ? 'btn-danger' : ''}" onclick="action('dryrun/toggle')">
              ${s.isDryRun ? 'Выключить Dry Run' : 'Включить Dry Run'}
            </button>
          </div>
        </div>

        <div class="card">
          <span class="card-label">Telegram Bot</span>
          <div class="badges">
            ${botRuntimeBadge}
          </div>
          <div class="actions">${botToggleBtn}</div>
        </div>

        <div class="card">
          <span class="card-label">Промпты (Gemini)</span>
          <div class="actions">
            <button class="btn" onclick="action('prompts/reload')">Перезагрузить из S3</button>
          </div>
        </div>
      `;
    }

    async function action(endpoint) {
      const btns = document.querySelectorAll('.btn');
      btns.forEach(b => b.disabled = true);

      try {
        const res = await fetch(`/admin/${endpoint}`, { method: 'POST' });
        if (res.status === 401) { location.href = '/admin/login'; return; }
        if (!res.ok) throw new Error('Ошибка сервера');
        showToast('Готово ✓');
        await loadStatus();
      } catch (e) {
        showToast('Ошибка: ' + e.message);
        btns.forEach(b => b.disabled = false);
      }
    }

    async function logout() {
      await fetch('/admin/logout', { method: 'POST' });
      location.href = '/admin/login';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    async function loadPrompts() {
      const spellcheckEl = document.getElementById('spellcheck-prompt');
      const variantsEl = document.getElementById('variants-prompt');
      spellcheckEl.placeholder = 'Загрузка...';
      variantsEl.placeholder = 'Загрузка...';

      try {
        const res = await fetch('/admin/api/prompts');
        if (res.status === 401) { location.href = '/admin/login'; return; }
        if (!res.ok) throw new Error('Ошибка сервера');
        const data = await res.json();

        spellcheckEl.value = data.spellcheck ?? '';
        variantsEl.value = data.variants ?? '';
        document.getElementById('spellcheck-file').textContent = data.spellcheckFile || '';
        document.getElementById('variants-file').textContent = data.variantsFile || '';
      } catch (e) {
        showToast('Ошибка загрузки промптов: ' + e.message);
      }
    }

    async function savePrompts() {
      const btn = document.getElementById('save-prompts-btn');
      btn.disabled = true;

      try {
        const body = {
          spellcheck: document.getElementById('spellcheck-prompt').value,
          variants: document.getElementById('variants-prompt').value
        };

        const res = await fetch('/admin/api/prompts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.status === 401) { location.href = '/admin/login'; return; }
        if (!res.ok) throw new Error('Ошибка сервера');
        showToast('Промпты сохранены в S3 ✓');
      } catch (e) {
        showToast('Ошибка: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => { loadStatus(); loadPrompts(); });
  </script>
</body>
</html>
