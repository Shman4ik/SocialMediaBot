<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Вход</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
      padding: 36px 32px;
      width: 100%;
      max-width: 360px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #111;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 5px;
    }

    input {
      display: block;
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #111;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 18px;
    }

    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 0.875rem;
      margin-bottom: 18px;
      display: none;
    }

    button[type="submit"] {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }

    button[type="submit"]:hover { background: #1d4ed8; }
    button[type="submit"]:active { background: #1e40af; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SocialMediaBot</h1>
    <p class="subtitle">Панель администратора</p>

    <div class="error" id="error-msg">Неверные данные. Попробуйте ещё раз.</div>

    <form method="post" action="/admin/login">
      <label for="username">Имя пользователя</label>
      <input id="username" type="text" name="username" autofocus autocomplete="username" required>

      <label for="password">Пароль</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>

      <button type="submit">Войти</button>
    </form>
  </div>

  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('username').focus();
    }
  </script>
</body>
</html>
