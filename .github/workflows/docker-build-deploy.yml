name: Build and Deploy

on:
  push:
    branches: [ "main" ]

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Set version
      id: version
      run: |
        echo "VERSION=0.1.${{ github.run_number }}" >> $GITHUB_ENV
        echo "Using version: 0.1.${{ github.run_number }}"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ghcr.io/shman4ik/socialmediabot:latest
          ghcr.io/shman4ik/socialmediabot:${{ env.VERSION }}

    - name: Check out dmnet-gitops
      uses: actions/checkout@v7
      with:
        repository: Shman4ik/dmnet-gitops
        ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
        path: gitops

    # Deploy = commit the new tag to dmnet-gitops; Argo CD in the cluster applies it within ~90 s.
    # Nothing connects to the VPS.
    - name: Point dmnet-gitops at the new image
      working-directory: gitops/workloads/socialmediabot
      run: |
        yq -i '(.images[] | select(.name == "ghcr.io/shman4ik/socialmediabot")).newTag = strenv(VERSION)' kustomization.yaml
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "socialmediabot ${VERSION}" -m "Built from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
        for attempt in 1 2 3; do git push && exit 0; git pull --rebase; done
        exit 1
